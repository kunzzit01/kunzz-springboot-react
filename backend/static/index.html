<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KUNZZ HOLDINGS</title>
    <!-- 启动加载提示的内联样式：随 HTML 立刻生效，不用等任何 CSS/JS 下载（React 挂载后整块被替换） -->
    <style>
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; background: #f7f2ea; color: #6b7280;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #boot-spin {
        width: 34px; height: 34px; border: 3px solid #ffd9bf; border-top-color: #ff5c00; border-radius: 50%;
        animation: bootspin 0.9s linear infinite;
      }
      #boot-title { font-size: 15px; font-weight: 600; color: #374151; }
      #boot-hint { font-size: 12.5px; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
    <!-- 外部资源：字体走 Google Fonts（异步，纯观感不阻塞）；其余库全部自托管在 /vendor/
         —— 不再依赖外网 CDN，弱网或 CDN 抽风也不会卡首屏、不会白屏。
         （jQuery / Chart.js / jspdf+autotable / html2canvas 仍以全局变量暴露：页面里用 window.jQuery / window.Chart /
          window.jspdf / window.html2canvas，所以文件名与版本刻意保持和原来一致，方便日后升级对照。）
         脚本用 defer：不阻塞首屏渲染，执行顺序保持原样。 -->
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/vendor/orgchart.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"
          media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet"
          media="print" onload="this.media='all'" />
    <script defer src="/vendor/jquery-3.6.0.min.js"></script>
    <script defer src="/vendor/html2canvas-1.4.1.min.js"></script>
    <script defer src="/vendor/jspdf-2.5.1.umd.min.js"></script>
    <script defer src="/vendor/jspdf-autotable-3.5.31.min.js"></script>
    <script defer src="/vendor/chart-3.9.1.min.js"></script>
    <script defer src="/vendor/orgchart.min.js"></script>
    <script defer src="/pdf-lib.min.js"></script>
    <script defer src="/fontkit.umd.min.js"></script>
    <script type="module" crossorigin src="/assets/index-K70lqb3v.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BTOT-EGs.css">
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div id="boot-spin"></div>
        <div id="boot-title">正在加载库存系统…</div>
        <div id="boot-hint">如果长时间停在这里，请检查网络后刷新页面</div>
      </div>
    </div>
  </body>
</html>
