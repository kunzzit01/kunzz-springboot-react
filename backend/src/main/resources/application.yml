server:
  port: 8081

spring:
  application:
    name: inventory-backend
  datasource:
    # 生产环境通过环境变量覆盖（DB_URL / DB_USERNAME / DB_PASSWORD），开发用本地默认值
    url: ${DB_URL:jdbc:mysql://localhost:3306/u690174784_kunzz?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none   # 老库结构由原备份管理，禁止 Hibernate 改表
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  # 邮件 SMTP（对齐旧系统 kunzzgroup-main/backend/mailer_config.php，Gmail 应用密码）
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:kunzzsup@gmail.com}
    # 安全起见，应用密码不写入源码；需要邮件功能时通过环境变量 SMTP_PASS 注入
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 10000
          connectiontimeout: 10000

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 注入强随机密钥（上线前务必更换）
  secret: ${JWT_SECRET:kunzz-inventory-system-jwt-secret-2026-change-in-production-0123456789}
  expiration: 86400

# 前端登录地址（欢迎邮件里的登录按钮）
app:
  base-url: ${APP_BASE_URL:http://localhost:5174}

# 生产环境 CORS 允许域名（逗号分隔，如 https://admin.example.com,https://www.example.com）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

logging:
  level:
    com.kunzz: info

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

# 本地 AI 助手（Ollama，零费用；模型经 Modelfile 导入为 kunzz-ai）
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:kunzz-ai}
